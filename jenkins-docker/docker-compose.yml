services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"     # Jenkins web UI
      - "50000:50000"   # Jenkins agent port (not used here, but standard to expose)
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the HOST's Docker socket so Jenkins can run docker/docker-compose
      # commands that build & run containers on the host - without needing
      # Docker installed on the host's shell/PATH at all.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your Mac's kubeconfig (read-only) so kubectl inside Jenkins can
      # talk to Docker Desktop's built-in Kubernetes cluster, using the same
      # context/credentials `kubectl` on your host already uses.
      - ~/.kube:/var/jenkins_home/.kube:ro
    environment:
      # Tell kubectl inside the container exactly where the mounted config is.
      - KUBECONFIG=/var/jenkins_home/.kube/config
    extra_hosts:
      # Docker Desktop's kubeconfig points at kubernetes.docker.internal - make
      # sure that hostname resolves to the host machine from inside this
      # container too (host.docker.internal already resolves automatically on
      # Docker Desktop for Mac, but kubernetes.docker.internal is added here
      # explicitly to be safe).
      - "kubernetes.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins_home:
