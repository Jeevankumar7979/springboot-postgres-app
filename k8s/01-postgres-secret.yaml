# NOTE: base64 is NOT encryption - this is fine for local Docker Desktop k8s,
# but for real clusters use a proper secrets manager (Sealed Secrets, Vault, etc).
# Values below are base64 of: demodb / postgres / postgres
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: demo-app
type: Opaque
data:
  POSTGRES_DB: ZGVtb2Ri
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
